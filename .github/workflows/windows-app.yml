name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-app.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'electron/**'
      - 'shared/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  windows:
    name: Windows 10 and 11 x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test validation, PowerShell and real registry rollback on disposable runner
        run: npm test
        env:
          LAGOPHONE_WINDOWS_INTEGRATION: '1'
      - name: Build installer
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build standalone executable
        run: npm run dist:portable -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content ($_.FullName + '.sha256') -Encoding ascii
          }
      - name: Downloadable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: LAGOPHONE-Windows-x64
          path: |
            release/*.exe
            release/*.exe.sha256
          if-no-files-found: error
          retention-days: 30
