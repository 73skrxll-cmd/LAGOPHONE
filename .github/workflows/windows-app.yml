name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-app.yml'
      - '.github/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'electron/**'
      - 'shared/**'
      - 'scripts/**'
      - 'native/**'
      - 'assets/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: Game animation in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: stable
      - run: npm run test:ui
        env:
          CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}
          GTM_TEST_OUTPUT: /tmp/gtm-animation-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GTM-PC-animation-check
          path: |
            /tmp/gtm-animation-ui/*.png
            /tmp/gtm-animation-ui/*.log
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows 10 and 11 x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache: false
      - name: Prepare pinned network components and source licenses
        run: npm run prepare:blocking
      - name: Prepare official pinned PresentMon component
        run: node .github/scripts/prepare-presentmon.cjs
      - name: Test validation, PowerShell and real registry rollback on disposable runner
        run: node .github/scripts/run-tests.cjs
        env:
          LAGOPHONE_WINDOWS_INTEGRATION: '1'
      - name: Build installer
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build standalone executable
        run: npm run dist:portable -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify app name and embedded Windows icon
        run: node .github/scripts/verify-windows-brand.cjs
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content ($_.FullName + '.sha256') -Encoding ascii
          }
      - name: Downloadable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: GTM-PC-Windows-x64
          path: |
            release/*.exe
            release/*.exe.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish latest Windows download
    needs: [ui, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GTM-PC-Windows-x64
          path: release
      - name: Prepare stable download names and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check --strict ./*.sha256
          version=$(node -p "require('../package.json').version")
          cp "GTM-PC-Setup-${version}-x64.exe" GTM-PC-Setup-x64.exe
          cp "GTM-PC-Portable-${version}-x64.exe" GTM-PC-Portable-x64.exe
          sha256sum GTM-PC-Setup-x64.exe GTM-PC-Portable-x64.exe > SHA256SUMS.txt
      - name: Publish completed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="windows-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          title="GTM PC ${version} · сборка ${GITHUB_RUN_NUMBER}"
          cat > /tmp/release-notes.md <<'NOTES'
          ## Скачать для Windows 10 / 11 x64

          - **GTM-PC-Setup-x64.exe** — установщик приложения.
          - **GTM-PC-Portable-x64.exe** — запуск без установки.
          - **SHA256SUMS.txt** — контрольные суммы готовых EXE.

          Node.js и npm пользователю не нужны. EXE пока без цифровой подписи.
          Сборка прошла тесты, включая применение и точный откат реестра на одноразовом Windows runner.
          NOTES
          if [[ "$version" == *-* ]]; then
            cat >> /tmp/release-notes.md <<'BETA'

          ### Раздел «Блокировки»

          - Встроены Zapret 1.10.4 (22 стратегии) и headless-ядро fnport 0.6.3 для Fortnite, без второго окна и ручных команд. Компоненты загружаются из официальных источников с закреплёнными SHA-256 и включены в сборку вместе с лицензиями и исходниками библиотек.
          - Подбор стратегии сравнивает одинаковые HTTPS IPv4 цели двумя сериями и повторно проверяет лучшую стратегию. Если улучшения нет, сохраняет прежний режим. HTTPS не подтверждает голос, видео или вход в матч.
          - Проверка провайдера fnport: STUN, реальные UDP-маяки Epic, фейк и TTL; рекомендации сохраняются. Игровые соединения идут напрямую через локальный Wintun; удалённого VPN-узла здесь нет.
          - Права Windows запрашиваются только при запуске сетевого компонента. Собственные дочерние процессы ограничены Windows Job Objects; при выходе или потере heartbeat выполняется остановка. Чужие процессы и VPN не завершаются, защита не отключается.
          - До смены режима нужно закрыть игру. Игровой фильтр Zapret нельзя включить вместе с fnport. fnport обрабатывает IPv4, IPv6 через него не проходит.

          Сборка и автоматические проверки опубликованы в Actions этого коммита. Возможность входа в Creative и обычный матч на подключении пользователя ещё нужно проверить. fnport помогает при определённых видах фильтрации и не является универсальным исправлением ошибок Fortnite. Документация: docs/blocking.md.

          BETA
          fi
          printf '\nКоммит: `%s`\n' "$GITHUB_SHA" >> /tmp/release-notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes-file /tmp/release-notes.md --draft
          gh release upload "$tag" release/GTM-PC-Setup-x64.exe release/GTM-PC-Portable-x64.exe release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
          if [[ "$version" == *-* ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
