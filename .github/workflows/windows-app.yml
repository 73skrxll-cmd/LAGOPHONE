name: Build Windows application

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-app.yml'
      - '.github/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'electron/**'
      - 'shared/**'
      - 'scripts/**'
      - 'assets/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tsconfig.json'

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui:
    name: Game animation in Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: stable
      - run: npm run test:ui
        env:
          CHROMIUM_BIN: ${{ steps.chrome.outputs.chrome-path }}
          GTM_TEST_OUTPUT: /tmp/gtm-animation-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GTM-PC-animation-check
          path: |
            /tmp/gtm-animation-ui/*.png
            /tmp/gtm-animation-ui/*.log
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows 10 and 11 x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install signed official WireGuard for native component tests (no VPN profile)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $msi = Join-Path $env:RUNNER_TEMP 'wireguard.msi'
          Invoke-WebRequest -Uri 'https://download.wireguard.com/windows-client/wireguard-amd64-1.1.1.msi' -OutFile $msi
          if ((Get-FileHash $msi -Algorithm SHA256).Hash -ne '7BFED60AD61B785C914B38B61555A975488E1D3EC472DBFB2FCDF498FCA75242') { throw 'WireGuard checksum mismatch' }
          $signature = Get-AuthenticodeSignature $msi
          if ($signature.Status -ne 'Valid') { throw 'WireGuard signature invalid' }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', ('"' + $msi + '"'), '/qn', '/norestart', 'DO_NOT_LAUNCH=1') -Wait -PassThru
          if ($install.ExitCode -notin @(0,3010)) { throw 'WireGuard install failed' }
      - name: Test validation, PowerShell and real registry rollback on disposable runner
        run: node .github/scripts/run-tests.cjs
        env:
          LAGOPHONE_WINDOWS_INTEGRATION: '1'
      - name: Verify real local diagnostics on disposable Windows
        run: node .github/scripts/verify-network-session.cjs
      - name: Preserve real network measurements
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GTM-PC-network-session-check
          path: release/network-session-check.json
          if-no-files-found: ignore
      - name: Build installer
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build standalone executable
        run: npm run dist:portable -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify app name and embedded Windows icon
        run: node .github/scripts/verify-windows-brand.cjs
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content ($_.FullName + '.sha256') -Encoding ascii
          }
      - name: Downloadable Windows application
        uses: actions/upload-artifact@v4
        with:
          name: GTM-PC-Windows-x64
          path: |
            release/*.exe
            release/*.exe.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish latest Windows download
    needs: [ui, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GTM-PC-Windows-x64
          path: release
      - name: Prepare stable download names and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum --check --strict ./*.sha256
          version=$(node -p "require('../package.json').version")
          cp "GTM-PC-Setup-${version}-x64.exe" GTM-PC-Setup-x64.exe
          cp "GTM-PC-Portable-${version}-x64.exe" GTM-PC-Portable-x64.exe
          sha256sum GTM-PC-Setup-x64.exe GTM-PC-Portable-x64.exe > SHA256SUMS.txt
      - name: Publish completed release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="windows-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          title="GTM PC ${version} · сборка ${GITHUB_RUN_NUMBER}"
          cat > /tmp/release-notes.md <<'NOTES'
          ## Скачать для Windows 10 / 11 x64

          - **GTM-PC-Setup-x64.exe** — установщик приложения.
          - **GTM-PC-Portable-x64.exe** — запуск без установки.
          - **SHA256SUMS.txt** — контрольные суммы готовых EXE.

          Node.js и npm пользователю не нужны. EXE пока без цифровой подписи.
          Сборка прошла тесты, включая применение и точный откат реестра на одноразовом Windows runner.
          NOTES
          if [[ "$version" == *-* ]]; then
            cat >> /tmp/release-notes.md <<'BETA'

          ### «Пинг»: свой бесплатный удалённый узел через WireGuard

          - Полный туннель через личный профиль Proton VPN Free и отдельно установленный официальный WireGuard. Нужны первоначальный бесплатный аккаунт, свой профиль и согласие на туннель всего ПК.
          - Проверки handshake, маршрутов Epic/DNS, политики IPv6, смены выходного IP и страны до отправки запроса запуска. Регион во время игры не переключается.
          - Штатный Epic URI из манифеста или фактической папки установки. Shipping.exe не запускается напрямую.
          - Контрольные сценарии обычного подключения/GearUP/GTM и пользовательские отметки обычного матча/Creative. Поддержка безопасного отчёта без токенов, ключей и сырых логов.
          - Целочисленный нулевой ICMP RTT показан как <1 мс. Нет сравнения «результата оптимизации» без применённых действий.

          CI проверяет Windows-компонент WireGuard, DPAPI, логику проверок/восстановления и сборку. Собственный бесплатный профиль и компьютер пользователя здесь недоступны: реальный handshake с его сервером, доступность Epic, вход в обычный матч/Creative и снижение игрового пинга не подтверждены. Принимаются только личные профили; общих ключей, подписок и случайных прокси нет.
          BETA
          fi
          printf '\nКоммит: `%s`\n' "$GITHUB_SHA" >> /tmp/release-notes.md
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$title" --notes-file /tmp/release-notes.md --draft
          gh release upload "$tag" release/GTM-PC-Setup-x64.exe release/GTM-PC-Portable-x64.exe release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
          if [[ "$version" == *-* ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
